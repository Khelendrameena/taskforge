[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.1.0"
description = "A distributed task queue built from scratch on Redis: priority queues, leases, idempotency, retries, DLQ."
requires-python = ">=3.11"
dependencies = ["redis>=5,<9"]

[project.scripts]
taskforge = "taskforge.cli:main"

[tool.setuptools.packages.find]
include = ["taskforge*"]
